
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livro - Biblioteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h1 { color: #26364a; }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background: #247a48;
            color: white;
            border: none;
            cursor: pointer;
        }

        #mensagem { margin-top: 15px; }
    </style>
</head>

<body>

    <div class="container">
        <h1 id="tituloPagina">Cadastrar livro</h1>

        <form id="formLivro">

            <label for="titulo">Título:</label>
            <input
                type="text"
                id="titulo"
                required
                minlength="2"
                maxlength="150"
            >

            <label for="autor">Autor:</label>
            <input
                type="text"
                id="autor"
                required
                minlength="2"
                maxlength="100"
            >

            <label for="anoPublicacao">Ano de publicação:</label>
            <input
                type="number"
                id="anoPublicacao"
                min="1"
                required
            >

            <label for="disponivel">Disponibilidade:</label>
            <select id="disponivel">
                <option value="true">Disponível</option>
                <option value="false">Emprestado</option>
            </select>

            <button type="submit" id="botaoSalvar">Cadastrar livro</button>
        </form>

        <p id="mensagem"></p>

        <a href="/livros.html">Voltar para livros</a>
        <br><br>
        <a href="/">Voltar ao início</a>
    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const id = parametros.get('id');

        const formulario = document.getElementById('formLivro');
        const tituloPagina = document.getElementById('tituloPagina');
        const botaoSalvar = document.getElementById('botaoSalvar');
        const mensagem = document.getElementById('mensagem');

        // Atualiza o limite do ano automaticamente.
        document.getElementById('anoPublicacao').max =
            new Date().getFullYear();

        // Carrega os dados quando o formulário estiver em modo de edição.
        async function carregarLivro() {
            if (!id) return;

            tituloPagina.textContent = 'Editar livro';
            botaoSalvar.textContent = 'Salvar alterações';

            try {
                const resposta = await fetch(
                    '/livros/' + encodeURIComponent(id)
                );

                const livro = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(livro.erro || 'Livro não encontrado.');
                }

                document.getElementById('titulo').value = livro.titulo;
                document.getElementById('autor').value = livro.autor;
                document.getElementById('anoPublicacao').value =
                    livro.anoPublicacao;
                document.getElementById('disponivel').value =
                    String(livro.disponivel);

            } catch (erro) {
                mensagem.textContent = erro.message;
                botaoSalvar.disabled = true;
            }
        }

        // Cadastra ou atualiza o livro.
        formulario.addEventListener('submit', async function(evento) {
            evento.preventDefault();

            const dados = {
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                anoPublicacao: Number(
                    document.getElementById('anoPublicacao').value
                ),
                disponivel:
                    document.getElementById('disponivel').value === 'true'
            };

            const metodo = id ? 'PUT' : 'POST';

            const url = id
                ? '/livros/' + encodeURIComponent(id)
                : '/livros';

            try {
                const resposta = await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        resultado.erro || 'Erro ao salvar livro.'
                    );
                }

                alert(id
                    ? 'Livro atualizado com sucesso!'
                    : 'Livro cadastrado com sucesso!');

                window.location.href = '/livros.html';

            } catch (erro) {
                mensagem.textContent = erro.message;
            }
        });

        carregarLivro();
    </script>

</body>
</html>
