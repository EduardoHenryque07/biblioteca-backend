
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Biblioteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h1 { color: #26364a; }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background: #247a48;
            color: white;
            border: none;
            cursor: pointer;
        }

        #mensagem { margin-top: 15px; }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="titulo">Cadastrar usuário</h1>

        <form id="formUsuario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required minlength="2" maxlength="100">

            <label for="email">E-mail:</label>
            <input type="email" id="email" required maxlength="150">

            <button type="submit" id="botaoSalvar">Cadastrar</button>
        </form>

        <p id="mensagem"></p>

        <a href="/usuarios.html">Voltar para usuários</a>
        <br><br>
        <a href="/">Voltar ao início</a>
    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const id = parametros.get('id');

        const formulario = document.getElementById('formUsuario');
        const titulo = document.getElementById('titulo');
        const botaoSalvar = document.getElementById('botaoSalvar');
        const mensagem = document.getElementById('mensagem');

        // Se existir ID na URL, o formulário será usado para edição.
        async function carregarUsuario() {
            if (!id) return;

            titulo.textContent = 'Editar usuário';
            botaoSalvar.textContent = 'Salvar alterações';

            try {
                const resposta = await fetch('/usuarios/' + encodeURIComponent(id));
                const usuario = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(usuario.erro || 'Usuário não encontrado.');
                }

                document.getElementById('nome').value = usuario.nome;
                document.getElementById('email').value = usuario.email;

            } catch (erro) {
                mensagem.textContent = erro.message;
                botaoSalvar.disabled = true;
            }
        }

        formulario.addEventListener('submit', async function(evento) {
            evento.preventDefault();

            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value
            };

            const metodo = id ? 'PUT' : 'POST';
            const url = id
                ? '/usuarios/' + encodeURIComponent(id)
                : '/usuarios';

            try {
                const resposta = await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro || 'Erro ao salvar usuário.');
                }

                alert(id
                    ? 'Usuário atualizado com sucesso!'
                    : 'Usuário cadastrado com sucesso!');

                window.location.href = '/usuarios.html';

            } catch (erro) {
                mensagem.textContent = erro.message;
            }
        });

        carregarUsuario();
    </script>
</body>
</html>
